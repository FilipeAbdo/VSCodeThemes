<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="tile"><rect x="4" y="4" width="248" height="248" rx="40"/></clipPath>
    <linearGradient id="ribbon" x2="0.5" y2="1">
      <stop stop-color="var(--violet-light, #deacde)"/>
      <stop offset="1" stop-color="var(--violet-medium, #9e4a9e)"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="var(--background, #180025)"/>
    <g id="editor-backdrop">
      <rect x="4" y="4" width="248" height="34" fill="var(--tabs, #180025)"/>
      <rect x="17" y="12" width="107" height="22" rx="9" fill="var(--selection, #711971)"/>
      <text x="30" y="27" font-family="Consolas, monospace" font-size="11" fill="var(--foreground, #e3f8f8)">violet.js</text>
      <g font-family="Consolas, monospace" font-size="11">
        <g fill="var(--muted, #4c8f95)" font-size="9">
          <text x="15" y="61">1</text><text x="15" y="83">2</text>
          <text x="15" y="105">3</text><text x="15" y="127">4</text>
          <text x="15" y="149">5</text><text x="15" y="171">6</text>
          <text x="15" y="193">7</text><text x="15" y="215">8</text>
          <text x="15" y="237">9</text>
        </g>
        <g id="code-snippet" font-size="9">
          <text x="33" y="61" fill="#39884b" font-style="italic">// A little more violet</text>
        </g>
      </g>
    </g>
    <rect id="backdrop-dimmer" width="256" height="256" fill="var(--background, #180025)" opacity=".35"/>
    <g id="violet-mark">
      <path d="M47 64h45l37 99 35-99h45l-61 155h-40z" fill="var(--background, #180025)" stroke="var(--background, #180025)" stroke-width="8" stroke-linejoin="round"/>
      <path d="M164 64h45l-61 155h-40z" fill="url(#ribbon)"/>
      <path d="m47 64 61 155 21-56-37-99z" fill="var(--violet, #be75be)"/>
      <path id="contrast-diamond" d="m128 29 9 13-9 13-9-13z" fill="var(--diamond, #89ddff)"/>
    </g>
  </g>
  <rect x="5" y="5" width="246" height="246" rx="39" fill="none" stroke="var(--violet, #be75be)" stroke-opacity=".5" stroke-width="2"/>
</svg>
