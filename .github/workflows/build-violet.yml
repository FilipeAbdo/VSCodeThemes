name: Build Violet theme

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
    paths:
      - 'Violet/src/**'
      - 'Violet/images/icon-source.svg'
      - 'Violet/scripts/**'
      - 'Violet/package.json'
      - 'Violet/package-lock.json'
      - '.github/workflows/build-violet.yml'
  pull_request:
    paths:
      - 'Violet/src/**'
      - 'Violet/images/icon-source.svg'
      - 'Violet/scripts/**'
      - 'Violet/package.json'
      - 'Violet/package-lock.json'
      - '.github/workflows/build-violet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Violet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Violet/package-lock.json
      - run: npm ci
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const tag = process.env.RELEASE_TAG; const manifest = require('./package.json'); const lock = require('./package-lock.json'); if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) || manifest.version !== tag || lock.version !== tag || lock.packages[''].version !== tag) { throw new Error('Release tag must match package.json and package-lock.json versions. Use npm run release.'); }"
      - run: npx playwright install chromium
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: violet-theme-build
          if-no-files-found: error
          path: |
            Violet/themes/VS Code Violet Theme-color-theme.json
            Violet/package.json
            Violet/package-lock.json
            Violet/palette.html
            Violet/images/palette.png
            Violet/images/icon.png
            Violet/images/icon.svg
            Violet/README.md
